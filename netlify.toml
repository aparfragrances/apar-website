[build]
  publish = "public"
  functions = "netlify/functions"
  command = "node scripts/build-seo.js"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/assets/pdf/*.ttf", "public/assets/pdf/apar-logo.png"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[redirects]]
  from = "/media/*"
  to = "/.netlify/functions/image?id=:splat"
  status = 200

# Old IndiaMART website addresses -> new pages (keeps Google links working)
